<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Pokédex Search</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Pokédex Search</h1>
      </div>
      <a class="powered-by" href="https://www.coveo.com" target="_blank" rel="noopener">
        <span>Powered by</span>
        <img src="/coveo-logo.svg" alt="Coveo" width="87" height="22" />
      </a>
    </header>

    <!--
      fields-to-include lists the custom index fields the result template needs.
      The search hub is set from src/config.js in src/main.js.
    -->
    <atomic-search-interface
      fields-to-include='["pokemonimage", "pokemontype", "pokemongeneration"]'
    >
      <atomic-search-layout>
        <atomic-layout-section section="search">
          <!--
            Suggestions slower than the default 400 ms are dropped, which happened
            in testing. One second keeps them without a noticeable lag.
          -->
          <atomic-search-box suggestion-timeout="1000">
            <atomic-search-box-recent-queries></atomic-search-box-recent-queries>
            <atomic-search-box-query-suggestions></atomic-search-box-query-suggestions>
          </atomic-search-box>
        </atomic-layout-section>

        <atomic-layout-section section="facets">
          <atomic-facet-manager>
            <atomic-facet
              field="pokemontype"
              label="Type"
              number-of-values="18"
              sort-criteria="alphanumeric"
              data-lists-all-values
            ></atomic-facet>
            <!-- Natural sort keeps "Generation 10" after "Generation 9". -->
            <atomic-facet
              field="pokemongeneration"
              label="Generation"
              number-of-values="12"
              sort-criteria="alphanumericNatural"
              data-lists-all-values
            ></atomic-facet>
            <atomic-facet field="pokemonabilities" label="Ability"></atomic-facet>
          </atomic-facet-manager>
        </atomic-layout-section>

        <atomic-layout-section section="main">
          <!--
            RGA answers only from what the retrieved pages say. When they do not
            contain an answer (for example a comparison across all Pokémon), it
            declines, and this message is shown instead of leaving a gap.
          -->
          <atomic-generated-answer>
            <p slot="no-answer-message">
              The Pokédex pages don't contain an answer to this. Try asking about a specific
              Pokémon, or use <strong>Sort by</strong> to rank them, for example by base stats.
            </p>
          </atomic-generated-answer>
          <atomic-layout-section section="status">
            <atomic-breadbox></atomic-breadbox>
            <atomic-query-summary></atomic-query-summary>
            <atomic-sort-dropdown>
              <atomic-sort-expression
                label="Relevance"
                expression="relevancy"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Pokédex number"
                expression="pokemonnumber ascending"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Name (A to Z)"
                expression="pokemonname ascending"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Base stats (highest first)"
                expression="pokemontotal descending"
              ></atomic-sort-expression>
            </atomic-sort-dropdown>
            <atomic-did-you-mean></atomic-did-you-mean>
          </atomic-layout-section>

          <atomic-layout-section section="results">
            <atomic-result-list display="grid" image-size="large">
              <atomic-result-template>
                <!-- In a grid, a click anywhere on the card follows this link. -->
                <template slot="link">
                  <atomic-result-link
                    href-template="${pokemonDetailPage}?id=${raw.permanentid}"
                  ></atomic-result-link>
                </template>
                <template>
                  <atomic-result-section-visual>
                    <!-- The fallback image is set in src/main.js. -->
                    <atomic-result-image field="pokemonimage"></atomic-result-image>
                  </atomic-result-section-visual>
                  <atomic-result-section-title>
                    <!--
                      Opens this app's detail page; the link still logs the click to Coveo.
                      pokemonDetailPage is set on window in src/main.js.
                    -->
                    <atomic-result-link
                      href-template="${pokemonDetailPage}?id=${raw.permanentid}"
                    ></atomic-result-link>
                  </atomic-result-section-title>
                  <atomic-result-section-bottom-metadata>
                    <pokemon-types></pokemon-types>
                    <atomic-result-text field="pokemongeneration"></atomic-result-text>
                  </atomic-result-section-bottom-metadata>
                </template>
              </atomic-result-template>
            </atomic-result-list>
            <atomic-query-error></atomic-query-error>
            <atomic-no-results></atomic-no-results>
          </atomic-layout-section>

          <atomic-layout-section section="pagination">
            <atomic-pager></atomic-pager>
            <atomic-results-per-page choices-displayed="24,48,96"></atomic-results-per-page>
          </atomic-layout-section>
        </atomic-layout-section>
      </atomic-search-layout>
    </atomic-search-interface>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
